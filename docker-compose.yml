version: "3.9"

# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  finance-net:
    driver: bridge

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  mysql-data:
  mongo-data:
  kafka-data:

services:

  # ── MySQL 8.0 ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: finance_db
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: finance_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/migration:/docker-entrypoint-initdb.d
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── MongoDB 7.0 ───────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: finance-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: notifications_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./db/migration/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: finance-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode || curl -sf http://localhost:8080/commands/ruok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kafka Broker ──────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: finance-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"         # External access from host
      - "29092:29092"       # Internal Docker network access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka UI (optional, great for learning!) ───────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: finance-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - finance-net

  # ── Account Service ────────────────────────────────────────────────────────
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: finance-account-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"   # Application port
      - "8081:8081"   # Admin/healthcheck port
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: finance_db
      DB_USER: finance_user
      DB_PASSWORD: finance_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Transaction Service ────────────────────────────────────────────────────
  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: finance-transaction-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_healthy
    ports:
      - "8082:8080"
      - "8083:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: finance_db
      DB_USER: finance_user
      DB_PASSWORD: finance_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Notification Service ───────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: finance-notification-service
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8080"
      - "8085:8081"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: notifications_db
      MONGO_USER: root
      MONGO_PASSWORD: rootpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
